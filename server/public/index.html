<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Bangers - Guest Phone</title>
  <link rel="stylesheet" href="/css/guest.css">
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/guest/main.js"></script>
</head>
<body>

  <div id="connection" class="hidden">Reconnecting…</div>

  <h1>Bangers</h1>
  <p id="promptText"></p>

  <!-- Join View -->
  <form id="joinView" class="hidden">
    <p>Enter your name to join the party</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off" required />
    <button type="submit">Join</button>
  </form>

  <!-- Submission View -->
  <div id="submissionView" class="hidden">
    <input type="search" id="searchInput" placeholder="Search song or artist..." autocomplete="off" />
    <div id="results" class="song-list"></div>
  </div>

  <!-- Submitted View -->
  <div id="submittedView" class="hidden">
    <div id="submittedCard" class="big-card"></div>
    <button id="changeSongBtn" class="secondary">Change song</button>
  </div>

  <!-- Voting View -->
  <div id="voteView" class="hidden">
    <div id="voteList" class="song-list"></div>
  </div>

  <!-- Results View -->
  <div id="resultsView" class="hidden">
    <div id="resultsCard" class="big-card"></div>
  </div>

  <div id="status"></div>
</body>
</html>
