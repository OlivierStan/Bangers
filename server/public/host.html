<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bangers - Main Screen</title>
  <link rel="stylesheet" href="/css/host.css">
  <script src="/socket.io/socket.io.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- QR Codes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="/js/host/main.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="spotifyStatus">Connecting…</div>

  <div id="ui-overlay">
    <div id="roundBadge"></div>
    <h1 id="promptDisplay">Bangers</h1>
    <div id="status">Connecting to server…</div>

    <!-- LOBBY -->
    <section id="lobbyView" class="hidden">
      <div class="panel">
        <h3>Pick your categories</h3>
        <div id="categoryChips" class="chips"></div>
      </div>
      <div class="panel">
        <h3>Players</h3>
        <div id="lobbyPlayers" class="chips"></div>
      </div>
      <button id="startBtn">Start Game</button>
    </section>

    <!-- SUBMISSION -->
    <section id="submissionView" class="hidden">
      <div class="panel">
        <div id="submitPlayers" class="chips"></div>
      </div>
      <button id="voteBtn">Start Voting Now</button>
    </section>

    <!-- VOTING -->
    <section id="votingView" class="hidden">
      <div class="panel">
        <div id="votingTracks" class="tracks"></div>
      </div>
      <div class="panel">
        <div id="votePlayers" class="chips"></div>
      </div>
      <button id="endVoteBtn">Show Results Now</button>
    </section>

    <!-- RESULTS -->
    <section id="resultsView" class="hidden">
      <div class="panel winner" id="winnerCard"></div>
      <div class="columns">
        <div class="panel">
          <h3>This round</h3>
          <div id="tally" class="leaderboard"></div>
        </div>
        <div class="panel">
          <h3>🏆 Leaderboard</h3>
          <div id="leaderboard" class="leaderboard"></div>
        </div>
      </div>
      <button id="nextRoundBtn">Next Round</button>
      <button id="resetBtn" class="secondary">New Game</button>
    </section>
  </div>

  <div id="qr-container">
    <div id="qrcode"></div>
    <p>Scan to Join</p>
  </div>
</body>
</html>
